# Render blueprint: Dashboard -> New -> Blueprint -> this repository.
# Serves the model API and the built React app (frontend/dist is committed, so no Node build is needed).
services:
  - type: web
    name: furniture-model-studio
    runtime: python
    plan: free            # 512 MB; DINOv2-small adds about 90 MB of weights after the first photo prediction
    region: frankfurt
    branch: a100miles
    buildCommand: >-
      pip install -r requirements-render.txt &&
      python -c "from huggingface_hub import snapshot_download; snapshot_download('facebook/dinov2-small', allow_patterns=['*.json', '*.safetensors'])"
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: HF_HOME               # DINOv2 weights are downloaded at build time into the project folder
        value: /opt/render/project/src/.hf-cache
      - key: OMP_NUM_THREADS       # one thread and fewer allocator arenas keep memory under 512 MB
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
